<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten — Direction B · Document-first workspace</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Karla:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ================= Direction B tokens — light is the production default ================= */
:root{
  --font-head:"Figtree",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-ui:"Karla",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-doc:"Source Serif 4",ui-serif,Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#FFFFFF; --canvas:#E9ECF1; --surface:#FFFFFF; --surface-2:#F6F7F9; --muted:#EDEFF3;
  --border:#E0E3E9; --border-strong:#CBD0D8;
  --text:#111827; --text-2:#4B5563; --text-3:#8A919C;
  --accent:#2446B3; --accent-hover:#1C3890; --accent-soft:#EDF1FC; --on-accent:#FFFFFF;
  --primary:#111827; --primary-hover:#262F40; --on-primary:#FFFFFF;
  --hover:#F1F3F6; --press:#E6E9EE; --focus:#2446B3;
  --ok:#157F3C; --ok-bg:#E9F6EE; --wait:#9A5B07; --wait-bg:#FFF6E6; --wait-border:#F0D29C;
  --cut:#B42318; --cut-bg:#FEF3F2;
  --paper:#FFFFFF; --ink:#16181D;
  --e1:0 1px 2px rgba(17,24,39,.06),0 0 0 1px rgba(17,24,39,.07);
  --e2:0 1px 3px rgba(17,24,39,.08),0 12px 32px -8px rgba(17,24,39,.16);
  --e3:0 24px 56px -12px rgba(17,24,39,.28),0 0 0 1px rgba(17,24,39,.08);
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-full:999px;
  --dur-fast:120ms;--dur:200ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#15171C; --canvas:#0E1014; --surface:#1B1E24; --surface-2:#20242B; --muted:#262A32;
  --border:#2A2F38; --border-strong:#39404B;
  --text:#E8EAF0; --text-2:#A0A6B3; --text-3:#6B7280;
  --accent:#8AA4FF; --accent-hover:#A6BBFF; --accent-soft:#1B2547; --on-accent:#0E1014;
  --primary:#E8EAF0; --primary-hover:#FFFFFF; --on-primary:#111827;
  --hover:#222630; --press:#2A2F38; --focus:#8AA4FF;
  --ok:#4ADE80; --ok-bg:#12301C; --wait:#F5B454; --wait-bg:#33260F; --wait-border:#664A18;
  --cut:#F97066; --cut-bg:#3A1714;
  --paper:#FFFFFF; --ink:#16181D; /* the page stays paper-white in dark: it is what prints */
  --e1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);
  --e2:0 12px 32px -8px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
  --e3:0 24px 56px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:block}
.stage{position:fixed;inset:0;overflow:auto;background:var(--bg)}
.sp{flex:1}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-3);display:inline-block;flex:none}
.shell{container:shell/inline-size;position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%}
.hd{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border-bottom:1px solid var(--border);background:var(--bg);min-width:0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.wm{font:700 18px/1 var(--font-head);letter-spacing:-.02em}
.sep{color:var(--border-strong);font-size:18px}
.title{font:600 14.5px/20px var(--font-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:var(--r-full);background:var(--ok-bg);color:var(--ok);font:600 12.5px/1 var(--font-head);white-space:nowrap}
.credit{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 11px;border-radius:var(--r-full);box-shadow:0 0 0 1px var(--border);font:500 13px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.credit b{color:var(--text);font:600 13.5px/1 var(--font-head)}
.credit .buy{height:24px;padding:0 10px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font:600 12px/24px var(--font-head)}
.credit .buy:hover{background:var(--primary-hover)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 11.5px/30px var(--font-head);text-align:center}
.work{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
/* center: the document */
.docside{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.band{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.band .sc{font:700 30px/1 var(--font-head);letter-spacing:-.03em}
.band .sc small{font:500 12.5px/1 var(--font-ui);color:var(--text-3);letter-spacing:0;margin-left:2px}
.band .rs{flex:1;min-width:0}
.band .rs b{display:flex;align-items:center;gap:8px;font:600 15px/20px var(--font-head)}
.band .rs p{margin:2px 0 0;font:400 13.5px/19px var(--font-ui);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:var(--r-sm);font:500 13px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.lk:hover{background:var(--hover);color:var(--text)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 16px 0 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;font:600 14px/1 var(--font-head);color:var(--text-3);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.tab .ok{color:var(--ok)}
.tab .n{font:500 12px/1 var(--font-ui);color:var(--text-3)}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px;padding-bottom:6px}
.tg{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--r-sm);font:500 13px/1 var(--font-ui);color:var(--text-2)}
.tg:hover{background:var(--hover)}
.sw{width:28px;height:16px;border-radius:9px;background:var(--accent);position:relative}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.ib{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
.ib:hover{background:var(--hover);color:var(--text)}
.statusbar{display:flex;align-items:center;gap:8px;padding:8px 24px;font:500 12.5px/1 var(--font-ui);color:var(--text-3);background:var(--canvas)}
.statusbar .okt{display:inline-flex;align-items:center;gap:4px;color:var(--ok)}
.canvas{flex:1;overflow:auto;padding:4px 24px 48px}
.pagewrap{position:relative;max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,680px) 200px;gap:20px;justify-content:center}
.paper{background:var(--paper);color:var(--ink);border-radius:2px;box-shadow:var(--e2);padding:56px 64px 72px;font-family:var(--font-doc);min-height:880px}
.paper h1{font:700 30px/1.1 var(--font-doc);letter-spacing:-.01em;margin:0 0 6px}
.paper .ct{font:400 13px/1.4 var(--font-doc);color:#4a4f58;margin:0 0 20px}
.paper h2{font:600 11px/1 var(--font-head);letter-spacing:.12em;text-transform:uppercase;color:#4a4f58;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid #d9dce1}
.paper h3{font:600 15px/1.35 var(--font-doc);margin:0 0 4px}
.paper h3 small{font:400 13px/1 var(--font-doc);color:#5b616b;float:right;margin-top:3px}
.paper p,.paper li{font:400 14.5px/1.5 var(--font-doc)}
.paper p{margin:0}
.paper ul{margin:4px 0 0;padding-left:18px}.paper li{margin:0 0 4px}
.paper .cutrole{margin-top:14px;padding:10px 12px;margin-left:-12px;margin-right:-12px;border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(180,35,24,.035) 6px 12px);outline:1px dashed #e7b1ab}
.paper .cutrole h3,.paper .cutrole li{color:#9aa0a8;text-decoration:line-through;text-decoration-color:rgba(180,35,24,.55)}
.notes{position:relative}
.note{position:absolute;left:0;right:0;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--e1);font:400 12.5px/17px var(--font-ui);color:var(--text-2)}
.note b{display:flex;align-items:center;gap:6px;font:600 12.5px/17px var(--font-head);color:var(--text);margin-bottom:3px}
.note .k{display:inline-block;margin-top:6px;font:500 12px/1 var(--font-mono);color:var(--accent);background:var(--accent-soft);padding:3px 6px;border-radius:4px}
.note::before{content:"";position:absolute;left:-20px;top:16px;width:20px;border-top:1px dashed var(--border-strong)}
/* right: the coach */
.coach{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--border);background:var(--bg)}
.coach-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.coach-hd b{font:600 14.5px/20px var(--font-head)}
.coach-hd small{font:400 12.5px/1 var(--font-ui);color:var(--text-3)}
.thread{flex:1;overflow:auto;padding:16px 16px 8px}
.m{margin:0 0 18px}
.m.you{display:flex;justify-content:flex-end}
.m.you .bb{max-width:88%;padding:8px 12px;border-radius:12px 12px 4px 12px;background:var(--accent-soft);color:var(--text);font:400 14.5px/21px var(--font-ui)}
.m .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:600 13px/1 var(--font-head)}
.m p{margin:0 0 8px;font:400 14.5px/22px var(--font-ui);color:var(--text)}
.act{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 7px;border-radius:var(--r-sm);background:var(--surface-2);box-shadow:0 0 0 1px var(--border);font:500 12.5px/1 var(--font-ui);color:var(--text-2);margin:0 0 8px}
.act .ok{color:var(--ok)}.act .n{color:var(--text-3);font-weight:400}
.act.live{background:var(--surface);color:var(--text)}
.chip{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-md);box-shadow:var(--e1);background:var(--surface);text-align:left;margin:0 0 8px}
.chip:hover{box-shadow:var(--e2)}
.chip.on{box-shadow:0 0 0 2px var(--accent)}
.chip .fi{width:28px;height:34px;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:var(--text-2)}
.chip b{display:block;font:600 13.5px/18px var(--font-head)}
.chip small{display:flex;gap:6px;align-items:center;font:400 12px/16px var(--font-ui);color:var(--text-2)}
.chip small .okt{color:var(--ok);display:inline-flex;gap:3px;align-items:center}
.plan{border-radius:var(--r-md);box-shadow:var(--e1);background:var(--surface);margin:0 0 8px;overflow:hidden}
.plan .ph{display:flex;align-items:center;gap:8px;padding:9px 12px;font:600 13.5px/18px var(--font-head);border-bottom:1px solid var(--border)}
.plan .ph small{margin-left:auto;font:400 12px/1 var(--font-ui);color:var(--text-3)}
.plan li{list-style:none;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border-top:1px solid var(--border);font:500 13.5px/19px var(--font-ui)}
.plan li:first-child{border-top:0}
.plan ol{margin:0;padding:0}
.plan .rg{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-strong);margin-top:2px}
.plan .w{display:block;font:400 12.5px/17px var(--font-ui);color:var(--text-2)}
.plan .mn{font:500 12px/19px var(--font-ui);color:var(--text-3);white-space:nowrap}
.composer{margin:8px 12px 12px;border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--border-strong);background:var(--surface);padding:10px 10px 8px 12px}
.composer:focus-within{box-shadow:0 0 0 2px var(--accent)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font:400 14.5px/21px var(--font-ui);min-height:21px;padding:0 0 8px}
.composer textarea::placeholder{color:var(--text-3)}
.crow{display:flex;align-items:center;gap:4px}
.send{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.send:disabled{background:var(--muted);color:var(--text-3)}
.ctx{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent);font:500 12px/1 var(--font-ui)}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 900ms linear infinite}.caret{animation:blink 1s steps(1) infinite}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:7px;height:16px;background:var(--text);vertical-align:-3px;margin-left:2px;border-radius:2px}
/* phone: the document is the screen; the coach is a bottom sheet */
.sheet{display:none}
@container shell (max-width:760px){
  .app{grid-template-rows:50px minmax(0,1fr)}
  .hd .wm,.hd .sep,.hd .tier,.credit .lbl,.credit .buy{display:none}
  .credit{padding:0 11px}
  .work{grid-template-columns:1fr}
  .coach{display:none}
  .band{padding:10px 14px;gap:10px}.band .sc{font-size:24px}.band .lk{display:none}
  .band .rs p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tabs{padding:0 6px}.tools{display:none}.tab{padding:0 10px}
  .statusbar{padding:8px 14px;flex-wrap:wrap}.statusbar .path{display:none}
  .canvas{padding:4px 10px 150px}
  .pagewrap{grid-template-columns:1fr}.notes{display:none}
  .paper{padding:28px 22px 40px;min-height:0}
  .paper h1{font-size:24px}
  .paper .cutrole{margin-left:-8px;margin-right:-8px}
  .sheet{display:block;position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -12px 32px -8px rgba(17,24,39,.22),0 0 0 1px var(--border)}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:8px auto 6px}
  .sheet .last{display:flex;gap:10px;align-items:flex-start;padding:4px 16px 8px;font:400 13.5px/19px var(--font-ui);color:var(--text-2)}
  .sheet .last b{color:var(--text);font-family:var(--font-head)}
  .sheet .composer{margin:0 10px 10px}
  .sheet.open{top:88px;display:flex;flex-direction:column}
  .sheet.open .thread{flex:1}
}
/* phone frames */
.phones{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:40px 24px;background:var(--canvas)}
.phone{width:375px;height:812px;flex:none;border-radius:44px;background:var(--bg);box-shadow:0 0 0 10px #16171a,0 0 0 11px #3a3c42,var(--e3);overflow:hidden;display:flex;flex-direction:column}
.phone .sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 15px/1 var(--font-head);color:var(--text);background:var(--bg)}
.phone .shell{flex:1;height:auto;min-height:0}
.ph-cap{font:500 13px/18px var(--font-ui);color:var(--text-2);text-align:center;margin-top:16px}
@media (max-width:760px){.phones{padding:0;gap:0;flex-direction:column;background:var(--bg)}.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}.phone .sbar,.ph-cap,.phones>div+div{display:none}}
</style>
</head>

const SCREENS = [['landing', 'Landing / sign-in'], ['first', 'First run'], ['convo', 'Conversation'], ['verbatim', 'Conversation (fixture verbatim)'], ['doc', 'Document open'], ['gate', 'Gate'], ['credit', 'Buy credit'], ['error', 'Error'], ['phone', 'Phone 375px'], ['states', 'States']];
function route() {
  const h = (location.hash || '#convo').slice(1).split('&');
  const flags = {}; h.slice(1).forEach(f => { const [k, v] = f.split('='); flags[k] = v === undefined ? true : v; });
  return { screen: h[0] || 'convo', flags };
}
function setFlag(name, on) {
  const r = route(); if (on) r.flags[name] = true; else delete r.flags[name];
  location.hash = r.screen + Object.keys(r.flags).map(k => '&' + k + (r.flags[k] === true ? '' : '=' + r.flags[k])).join('');
}
function protoBar(title, extra) {
  const r = route();
  return '<nav class="proto" aria-label="Prototype screens"><span class="proto-t">' + title + '</span>' +
    SCREENS.map(s => '<a href="#' + s[0] + (r.flags.dark ? '&dark' : '') + '" class="' + (r.screen === s[0] ? 'on' : '') + '">' + s[1] + '</a>').join('') +
    '<span class="proto-sp"></span>' + (extra || '') +
    '<label><input type="checkbox" ' + (r.flags.dark ? 'checked' : '') + ' onchange="setFlag(\'dark\',this.checked)"> Dark</label></nav>';
}

.proto a{color:#a1a1aa;text-decoration:none;padding:6px 8px;border-radius:6px}.proto a:hover{color:#fff;background:#1f1f23}.proto a.on{color:#0b0b0d;background:#fff}
.proto-t{color:#fff;font-weight:600;margin-right:10px}.proto-sp{flex:1}.proto label{display:flex;gap:6px;align-items:center;padding:0 8px;cursor:pointer}
body.has-proto .stage{top:40px}body.clean .proto{display:none}`;
