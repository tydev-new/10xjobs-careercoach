<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten — Direction A · Conversation-first</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================= Direction A tokens (light is the production default) ================= */
:root{
  --font-ui:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-page:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; /* render_resume.py's own stack */

  --bg:#FFFFFF; --bg-subtle:#F7F7F8; --bg-muted:#EFEFF2; --surface:#FFFFFF; --surface-raised:#FFFFFF;
  --border:#E6E6EA; --border-strong:#D3D3DA;
  --text:#0B0B0D; --text-2:#51515B; --text-3:#8A8A94;
  --bubble:#F1F1F4;
  --primary:#0B0B0D; --primary-hover:#2A2A30; --primary-press:#000000; --on-primary:#FFFFFF;
  --hover:#F3F3F5; --press:#EAEAEE;
  --focus:#2F6FEB;
  --ok:#157F3C; --ok-bg:#EAF6EE; --ok-border:#BFE3CB;
  --wait:#9A5B07; --wait-bg:#FFF7E8; --wait-border:#F0D29C;
  --bad:#B42318; --bad-bg:#FEF3F2; --bad-border:#F5C7C1;
  --tier-stretch:#2B5AB5; --tier-stretch-bg:#EEF3FC; --tier-weak:#5E5E69; --tier-weak-bg:#F1F1F4;
  --scrim:rgba(11,11,13,.32);
  --mark-tile:#0B0B0D; --mark-glyph:#FFFFFF;

  --e1:0 1px 2px rgba(16,16,20,.05),0 0 0 1px rgba(16,16,20,.07);
  --e2:0 2px 4px -1px rgba(16,16,20,.06),0 8px 20px -6px rgba(16,16,20,.10),0 0 0 1px rgba(16,16,20,.07);
  --e3:0 24px 56px -12px rgba(16,16,20,.22),0 6px 16px -6px rgba(16,16,20,.10),0 0 0 1px rgba(16,16,20,.08);

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;--s16:64px;
  --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-full:999px;
  --dur-fast:120ms;--dur:200ms;--dur-slow:320ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#111113; --bg-subtle:#18181B; --bg-muted:#222226; --surface:#18181B; --surface-raised:#1F1F23;
  --border:#2A2A2F; --border-strong:#3A3A41;
  --text:#EDEDEF; --text-2:#A6A6B0; --text-3:#72727C;
  --bubble:#26262B;
  --primary:#EDEDEF; --primary-hover:#D4D4D8; --primary-press:#FFFFFF; --on-primary:#0B0B0D;
  --hover:#222226; --press:#2A2A2F;
  --focus:#7FA6FF;
  --ok:#4ADE80; --ok-bg:#12301C; --ok-border:#1F5131;
  --wait:#F5B454; --wait-bg:#33260F; --wait-border:#664A18;
  --bad:#F97066; --bad-bg:#3A1714; --bad-border:#6E2A24;
  --tier-stretch:#8FB2FF; --tier-stretch-bg:#18233F; --tier-weak:#A6A6B0; --tier-weak-bg:#26262B;
  --scrim:rgba(0,0,0,.6);
  --mark-tile:#EDEDEF; --mark-glyph:#111113;
  --e1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);
  --e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
  --e3:0 24px 56px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.stage{position:fixed;inset:0;overflow:auto;background:var(--bg)}
/*@PROTO@*/

/* ================= shell ================= */
.shell{container:shell/inline-size;position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-rows:56px 1fr;height:100%}
.app-body{display:grid;grid-template-columns:1fr 0;min-height:0;transition:grid-template-columns var(--dur-slow) var(--ease-out)}
.app-body.with-panel{grid-template-columns:1fr minmax(0,600px)}

/* header */
.hd{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4) 0 var(--s5);border-bottom:1px solid transparent;background:var(--bg);position:relative;z-index:5}
.hd.scrolled{border-bottom-color:var(--border)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text)}
.wm{font:650 18px/1 var(--font-ui);letter-spacing:-.025em}
.hd-sep{color:var(--border-strong);font-size:20px;font-weight:300;margin:0 2px}
.hd-title{font:500 14px/20px var(--font-ui);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd-sub{font:400 13px/20px var(--font-ui);color:var(--text-3);white-space:nowrap}
.sp{flex:1}
.credit{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;border:1px solid var(--border);border-radius:var(--r-full);background:var(--surface);font:500 13.5px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.credit b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.credit .buy{height:26px;padding:0 11px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font:600 12.5px/26px var(--font-ui);transition:background var(--dur-fast) var(--ease)}
.credit .buy:hover{background:var(--primary-hover)}.credit .buy:active{background:var(--primary-press)}
.credit.empty{border-color:var(--wait-border);background:var(--wait-bg);color:var(--wait)}
.credit.empty b{color:var(--wait)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-muted);color:var(--text);font:600 12.5px/32px var(--font-ui);text-align:center;letter-spacing:.02em;border:1px solid var(--border)}
.avatar:hover{background:var(--press)}

/* main + transcript */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-anchor:auto;scroll-padding-bottom:160px}
.col{max-width:768px;margin:0 auto;padding:var(--s6) var(--s6) 190px}
.turn{margin:0 0 var(--s8)}
.turn:last-child{margin-bottom:0}
.u{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{max-width:min(560px,85%);background:var(--bubble);padding:10px 16px;border-radius:20px 20px 6px 20px;font:400 16px/26px var(--font-ui);overflow-wrap:anywhere}
.bubble a{color:var(--text);text-decoration:underline;text-decoration-color:var(--text-3);text-underline-offset:3px}
.attach{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--e1)}
.attach .ft{width:32px;height:36px;border-radius:6px;background:var(--bg-muted);display:grid;place-items:center;color:var(--text-2);font:700 8.5px/1 var(--font-ui);letter-spacing:.04em}
.attach b{display:block;font:500 13.5px/18px var(--font-ui)}.attach small{font:400 12px/16px var(--font-ui);color:var(--text-3)}
.prose{font:400 16px/28px var(--font-ui);color:var(--text);max-width:680px}
.prose p{margin:0 0 14px}.prose p:last-child{margin-bottom:0}
.prose code{font:500 13px/1 var(--font-mono);background:var(--bg-muted);padding:2px 5px;border-radius:5px}
.prose b{font-weight:600}
.cuts{list-style:none;counter-reset:c;margin:4px 0 16px;padding:0;border-top:1px solid var(--border)}
.cuts li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;padding:12px 0;border-bottom:1px solid var(--border)}
.cuts li::before{content:counter(c);font:600 13px/26px var(--font-ui);color:var(--text-3)}
.cuts .why{display:block;font:400 14px/22px var(--font-ui);color:var(--text-2)}
.stack{display:flex;flex-direction:column;gap:10px;margin:14px 0}

/* activity line */
.act{margin:0 0 12px}
.act-sum{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 6px;margin-left:-6px;border-radius:var(--r-sm);font:500 14px/20px var(--font-ui);color:var(--text-2);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.act-sum:hover{background:var(--hover);color:var(--text)}
.act-sum .n{color:var(--text-3);font-weight:400}
.act-sum .chev{color:var(--text-3);transition:transform var(--dur) var(--ease)}
.act.open .chev{transform:rotate(90deg)}
.act .done{color:var(--ok)}
.act-steps{list-style:none;margin:6px 0 4px 2px;padding:2px 0 2px 18px;border-left:1px solid var(--border);display:none}
.act.open .act-steps{display:block}
.act-steps li{display:grid;grid-template-columns:16px 1fr;column-gap:10px;padding:5px 0;font:400 14px/20px var(--font-ui);color:var(--text)}
.act-steps li .ic{margin-top:2px;color:var(--text-3)}
.act-steps .m{color:var(--text-3)}
.act-steps .raw{grid-column:2;margin-top:4px;font:400 11.5px/17px var(--font-mono);color:var(--text-2);background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--r-xs);padding:6px 8px;overflow-wrap:anywhere}
.act-steps li.run .ic{color:var(--text)}
.act-steps li.todo{color:var(--text-3)}
.live .act-sum{color:var(--text)}
.shimmer{background:linear-gradient(90deg,var(--text-2) 0%,var(--text-2) 40%,var(--text) 50%,var(--text-2) 60%,var(--text-2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.spin{animation:none}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:spin 900ms linear infinite}
  .shimmer{animation:shim 1.8s linear infinite}
  .caret{animation:blink 1s steps(1) infinite}
  .panel-in{animation:slidein var(--dur-slow) var(--ease-out)}
  .dlg{animation:pop var(--dur) var(--ease-out)}
  .toast{animation:rise var(--dur-slow) var(--ease-out)}
  .sk{animation:pulse 1.4s var(--ease) infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes slidein{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pulse{50%{opacity:.55}}
.caret{display:inline-block;width:8px;height:18px;margin-left:2px;vertical-align:-3px;background:var(--text);border-radius:2px}

/* cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1)}
.docchip{display:flex;align-items:center;gap:14px;width:100%;max-width:520px;padding:12px 12px 12px 12px;text-align:left;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--e1);transition:box-shadow var(--dur) var(--ease),transform var(--dur-fast) var(--ease)}
.docchip:hover{box-shadow:var(--e2)}
.docchip:active{transform:scale(.995)}
.docchip.on{box-shadow:0 0 0 2px var(--text),var(--e1)}
.doc-ic{width:40px;height:48px;border-radius:7px;background:var(--bg-subtle);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex:none;position:relative}
.doc-ic::after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;background:linear-gradient(225deg,var(--bg) 50%,var(--border) 50%);border-bottom-left-radius:3px}
.docchip .tx{flex:1;min-width:0}
.docchip b{display:block;font:600 14.5px/20px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docchip .meta{display:flex;align-items:center;gap:6px;font:400 13px/18px var(--font-ui);color:var(--text-2);flex-wrap:wrap}
.docchip .meta .ok{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:500}
.docchip .open{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-sm);font:500 13px/1 var(--font-ui);color:var(--text-2)}
.docchip:hover .open{background:var(--hover);color:var(--text)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}

.verdict{padding:18px 20px;max-width:620px}
.v-top{display:flex;align-items:flex-start;gap:16px}
.v-co{display:flex;align-items:center;gap:6px;font:500 13px/18px var(--font-ui);color:var(--text-2)}
.v-title{font:600 19px/26px var(--font-ui);letter-spacing:-.015em;margin-top:2px}
.tier{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:var(--r-full);font:600 12.5px/1 var(--font-ui);white-space:nowrap}
.tier.strong{background:var(--ok-bg);color:var(--ok)}
.tier.investable_stretch{background:var(--tier-stretch-bg);color:var(--tier-stretch)}
.tier.weak{background:var(--tier-weak-bg);color:var(--tier-weak)}
.score{margin-left:auto;text-align:right;flex:none}
.score b{font:600 30px/30px var(--font-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score span{font:500 13px/1 var(--font-ui);color:var(--text-3)}
.score small{display:block;font:400 12px/16px var(--font-ui);color:var(--text-3);margin-top:3px}
.v-reason{font:400 15px/23px var(--font-ui);color:var(--text-2);margin:12px 0 0}
.v-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font:400 13px/18px var(--font-ui);color:var(--text-3)}
.v-foot .lnk{margin-left:auto}
.lnk{display:inline-flex;align-items:center;gap:4px;font:500 13.5px/20px var(--font-ui);color:var(--text);border-radius:6px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

.plan{padding:6px 0 4px;max-width:620px}
.plan-hd{display:flex;align-items:center;gap:10px;padding:10px 20px 10px}
.plan-hd h3{margin:0;font:600 15.5px/22px var(--font-ui);letter-spacing:-.01em}
.plan-hd .tot{margin-left:auto;font:400 13px/18px var(--font-ui);color:var(--text-3);white-space:nowrap}
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:22px 1fr auto;column-gap:12px;padding:12px 20px;border-top:1px solid var(--border)}
.ring{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);margin-top:2px}
.plan .pt{font:500 15px/22px var(--font-ui)}
.plan .pw{font:400 13.5px/20px var(--font-ui);color:var(--text-2);margin-top:1px}
.mins{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-full);background:var(--bg-subtle);border:1px solid var(--border);font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.minichip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;height:28px;padding:0 10px 0 8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font:500 12.5px/1 var(--font-ui);color:var(--text)}
.minichip:hover{background:var(--hover)}
.mins-in{display:none;font-weight:500;color:var(--text)}
.plan li.v .pt{font-weight:400;font-size:14.5px}
.plan li.v code{font:400 12px/1 var(--font-mono);background:var(--bg-muted);padding:2px 4px;border-radius:4px;overflow-wrap:anywhere}

.checker{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:520px}
.checker .lbl{font:600 11px/1 var(--font-mono);letter-spacing:.06em;color:var(--text-3)}
.checker b{font:500 13.5px/18px var(--font-mono)}
.checker .st{margin-left:auto;font:500 13px/1 var(--font-ui);color:var(--ok);display:flex;gap:5px;align-items:center}

.cost{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:520px}
.cost .ci{width:34px;height:34px;border-radius:9px;background:var(--bg-subtle);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex:none}
.cost b{display:block;font:500 14.5px/20px var(--font-ui)}
.cost small{font:400 13px/18px var(--font-ui);color:var(--text-3)}
.cost .amt{margin-left:auto;text-align:right;font:600 15px/20px var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost .amt small{display:block;font-weight:400}

.gate{max-width:620px;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--wait-border),var(--e2);overflow:hidden}
.gate.ok{box-shadow:var(--e1)}
.gate-hd{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--wait-bg);color:var(--wait);font:600 13.5px/20px var(--font-ui)}
.gate.ok .gate-hd{background:var(--ok-bg);color:var(--ok)}
.gate-hd .pill{margin-left:auto;font-weight:500;font-size:12.5px;opacity:.9}
.gate-b{padding:16px 18px 18px}
.gate-b h4{margin:0 0 10px;font:600 17px/24px var(--font-ui);letter-spacing:-.01em}
.gate-roles{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 20px;counter-reset:g}
.gate-roles li{counter-increment:g;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-ui)}
.gate-roles li::before{content:counter(g);color:var(--text-3);font-variant-numeric:tabular-nums;width:12px}
.gate-cost{display:flex;gap:24px;margin:0 0 14px;font:400 13px/18px var(--font-ui);color:var(--text-3)}
.gate-cost b{display:block;font:600 16px/22px var(--font-ui);color:var(--text);font-variant-numeric:tabular-nums}
.gate-line{margin:0;padding:12px 14px;border-radius:var(--r-md);background:var(--bg-subtle);font:600 15px/22px var(--font-ui)}
.gate-how{display:flex;align-items:center;gap:8px;margin-top:12px;font:400 13.5px/20px var(--font-ui);color:var(--text-2)}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--border-strong);border-bottom-width:2px;font:600 12px/1 var(--font-mono);color:var(--text);background:var(--surface)}

.err{display:flex;gap:12px;align-items:flex-start;max-width:620px;padding:14px 16px;border-radius:var(--r-md);background:var(--bad-bg);box-shadow:0 0 0 1px var(--bad-border);color:var(--text)}
.err .ic{color:var(--bad);margin-top:2px}
.err b{display:block;font:600 14.5px/20px var(--font-ui)}
.err p{margin:2px 0 0;font:400 14.5px/22px var(--font-ui);color:var(--text-2)}

/* composer */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--s6) var(--s5);pointer-events:none}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,transparent,var(--bg) 55%);pointer-events:none}
.dock.has-tip::before{height:200px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.composer{position:relative;max-width:720px;margin:0 auto;pointer-events:auto;background:var(--surface-raised);border-radius:var(--r-xl);box-shadow:var(--e2);padding:12px 12px 10px 16px;transition:box-shadow var(--dur) var(--ease)}
.composer:focus-within{box-shadow:0 0 0 1px var(--border-strong),var(--e2)}
.composer.gate-mode{box-shadow:0 0 0 2px var(--wait-border),var(--e2)}
.cmp-in{display:block;width:100%;min-height:26px;max-height:200px;resize:none;border:0;outline:0;background:transparent;font:400 16px/26px var(--font-ui);padding:2px 0 8px}
.cmp-in::placeholder{color:var(--text-3)}
.cmp-row{display:flex;align-items:center;gap:6px}
.ib{width:34px;height:34px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--text-2);transition:background var(--dur-fast) var(--ease)}
.ib:hover{background:var(--hover);color:var(--text)}.ib:active{background:var(--press)}
.tb{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:var(--r-full);border:1px solid var(--border);font:500 13px/1 var(--font-ui);color:var(--text-2);white-space:nowrap;transition:background var(--dur-fast) var(--ease)}

@container shell (max-width:700px){

}

}

    '<div style="margin-top:22px">' + act('e3') + '</div><div class="stack">' + verdict({ company: 'Solterra Robotics', title: 'Group PM', tier: 'weak', score: 31, reason: 'Hardware-heavy roadmap, little overlap with candidate’s SaaS background' }) + '</div>' + prose(['Solterra Robotics – Group PM: recorded as Weak Fit. Moving to the next one.']) +
    '<div class="stack"><div class="err" role="alert">' + ic('circle-alert', 18) + '<div><b>The run stopped</b><p>' + COPY.overBalance + '</p></div></div></div></div>';
  return h;
}
function page(kind) {
  if (kind === 'letter') return '<article class="page letter">' + LETTER.map(p => '<p>' + p + '</p>').join('') + '</article>';
  if (kind === 'fit') return '<article class="page"><h1 style="font-size:20px">Acme — Staff PM</h1><p class="ct">Fit analysis</p><h2>Decode</h2><p>Core ask: own the partner ecosystem roadmap end to end. Seniority signal: Staff, ambiguous IC-vs-lead. Competencies: API strategy, partner GTM, cross-functional leadership.</p><h2>Fit</h2><p>Strong match on ecosystem/API experience and team leadership; unclear on people-management scope.</p><h2>Company signals</h2><ul>' + SIGNALS.map(s => '<li>' + s + '</li>').join('') + '</ul></article>';
  const R = RESUME;
  return '<article class="page"><h1>' + R.name + '</h1><p class="ct">' + R.contact + '</p><h2>Summary</h2><p>' + R.summary + '</p><h2>Selected Experience</h2>' + R.roles.map(r => '<h3>' + r.head + '</h3><ul>' + r.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>').join('') + '<h2>Education</h2><p>' + R.education + '</p><h2>Skills</h2><p>' + R.skills + '</p></article>';
}
function panel(kind, o) {
  o = o || {};
  if (kind === 'empty') return '<aside class="panel"><div class="pn-empty"><div>' + ic('panel-right', 28, 1.5) + '<b>Nothing open yet</b><p>When Ten writes a résumé or a letter, open it from the chat and it shows here.</p></div></div></aside>';
  const isL = kind === 'letter', isF = kind === 'fit';
  const t = isL ? DOCS.letter : isF ? { title: 'Fit analysis — Acme', path: 'jd-analysis/acme-staff-pm.md' } : DOCS.resume;
  return '<aside class="panel panel-in" aria-label="Document"><div class="pn-hd"><button class="ib" aria-label="Close" onclick="openDoc(null)" style="display:' + (o.phone ? 'grid' : 'none') + '">' + ic('arrow-left', 18) + '</button><div class="tx"><b>' + t.title + '</b><small>' + (isF ? 'Written when Ten scored the role' : '<span class="nw">' + (isL ? 'Cover letter' : '109 words') + '</span><i class="dot"></i><span class="ok nw">' + ic('check', 12, 2.5) + 'Format checks passed</span><i class="dot"></i><span class="nw">Wording check not run</span>') + '</small></div>' +
    (o.phone ? '' : '<button class="ib" aria-label="Close panel" onclick="openDoc(null)">' + ic('x', 18) + '</button>') + '</div>' +
    (isF ? '' : '<div class="pn-tools"><div class="seg" role="tablist"><button class="' + (isL ? '' : 'on') + '" onclick="openDoc(\'resume\')">Résumé</button><button class="' + (isL ? 'on' : '') + '" onclick="openDoc(\'letter\')">Cover letter</button></div><span class="sp"></span><button class="ib" title="Copy text" aria-label="Copy text">' + ic('copy', 17) + '</button><button class="tb" onclick="showToast(\'Opened your browser’s print dialog\')">' + ic('printer', 15) + '<span class="lbl">Print or save PDF</span></button></div>') +
    '<div class="pn-body">' + page(kind) + '</div><div class="pn-meta">' + ic('folder-down', 13) + t.path + '</div></aside>';
}
function app(o) {
  const body = '<div class="app-body' + (o.panel ? ' with-panel' : '') + '"><main class="main"><div class="scroll" data-autoscroll="' + (o.top ? '0' : '1') + '"><div class="col">' + o.transcript + '</div></div>' + dock(o.dock) + '</main>' + (o.panel ? panel(o.panel, o) : '<div></div>') + '</div>';
  return '<div class="shell" data-theme="' + theme() + '"><div class="app">' + header(o) + body + '</div>' + (o.menu ? menu(o) : '') + (o.dialog ? creditDialog(o.dialog) : '') + (o.toast ? toastEl(o.toast) : '') + '</div>';
}
function menu(o) {
  const p = o.person || P.jordan;
  return '<div class="menu" role="menu"><div class="who"><b>' + p.name + '</b><small>' + p.email + '</small></div><button onclick="setFlag(\'dialog\',true)">' + ic('wallet', 16) + 'Buy credit</button><button>' + ic('folder-down', 16) + 'Export my files</button><button>' + ic('key-round', 16) + 'Set a new password</button><hr><button class="danger">' + ic('trash-2', 16) + 'Delete my beta data</button><button>' + ic('log-out', 16) + 'Sign out</button></div>';
}
function creditDialog(state) {
  const done = state === 'done';
  return '<div class="scrim" onclick="if(event.target===this)setFlag(\'dialog\',false)"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="bc"><div class="dlg-hd"><h2 id="bc">Buy credit</h2><span class="sp"></span><button class="ib" aria-label="Close" onclick="setFlag(\'dialog\',false)">' + ic('x', 18) + '</button></div>' +
    (done ? '<div class="ok-state">' + ic('circle-check', 20) + '<p>' + COPY.credited + '</p></div><button class="btn pri full lg" onclick="setFlag(\'dialog\',false)">Done</button>' :
      '<p>' + COPY.creditIntro + '</p><div class="amts" role="radiogroup" aria-label="Amount"><button class="on" role="radio" aria-checked="true">$10</button><button role="radio" aria-checked="false">$20</button><button role="radio" aria-checked="false">$40</button></div><button class="pp gold">Pay<span>Pal</span></button><button class="pp card">Debit or Credit Card</button><div class="pp-note">PayPal’s own buttons — the payment happens in PayPal’s window</div><p class="fine">' + COPY.creditUnder + '</p>') + '</div></div>';
}
function toastEl(t) { return '<div class="toast" role="status">' + ic('circle-check', 18) + t + '<button aria-label="Dismiss">' + ic('x', 14) + '</button></div>'; }

/* ---------------- screens ---------------- */
function theme() { return route().flags.dark ? 'dark' : 'light'; }
function scr_convo(f, voice) {
  return app({ title: 'Acme · Staff PM', bal: BAL.mvp, scrolled: true, transcript: mvpTranscript(voice, { stream: f.stream, docOn: f.doc }), dock: { running: f.stream }, panel: f.doc || null, menu: f.menu, dialog: f.dialog ? (f.dialog === 'done' ? 'done' : 'open') : null });
}
const S = {
  landing(f) { return landing(); },
  first(f) {
    return '<div class="shell" data-theme="' + theme() + '"><div class="app">' + header({ bal: BAL.first }) + '<div class="first">' + markSvg(44, 'var(--mark-tile)', 'var(--mark-glyph)', 'var(--mark-glyph)') + '<h1>I don’t have anything of yours yet.</h1><p class="lead">Drop in a résumé, or tell me the job you’re going for, and I’ll start your workspace.</p>' + composer({ ph: 'Tell Ten the job you’re going for, or attach your résumé' }) +
      '<div class="starters"><button class="tb">' + ic('paperclip', 15) + 'Add my résumé (PDF)</button><button class="tb">' + ic('link', 15) + 'Paste a job posting</button><button class="tb">' + ic('target', 15) + 'Say what you’re looking for</button></div><div class="foot">These fill in the message box — nothing is sent until you press Enter.</div></div></div>' + (f.menu ? menu({}) : '') + '</div>';
  },
  convo(f) { return scr_convo(f, 'target'); },
  verbatim(f) { return scr_convo(f, 'verbatim'); },
  doc(f) { f.doc = f.doc || 'resume'; return scr_convo(f, 'target'); },
  gate(f) {
    const ok = f.approved;
    return app({ title: 'Saved roles', bal: BAL.gate, initials: 'PN', person: P.priya, scrolled: true, transcript: gateTranscript(ok ? 'ok' : 'wait'), dock: ok ? {} : { gate: true, value: 'yes', ph: 'Type yes to approve, or ask a question' } });
  },
  credit(f) { return app({ title: 'Acme · Staff PM', bal: f.done ? '$13.36' : BAL.mvp, scrolled: true, transcript: mvpTranscript('target', {}), dock: {}, dialog: f.done ? 'done' : 'open', toast: f.toast ? 'Added $9.16 of credit' : null }); },
  error(f) { return app({ title: 'Saved roles', bal: BAL.err, empty: true, initials: 'SO', person: P.sam, scrolled: true, transcript: errorTranscript(), dock: {} }); },
  phone(f) {
    const ph = (inner, kb, cap) => '<div><div class="phone" data-theme="' + theme() + '"><div class="sb"><span>9:41</span>' + SB_ICONS + '</div>' + inner + (kb ? '<div class="kb">' + [10, 9, 9, 3].map((n, r) => '<div>' + Array.from({ length: n }, (_, i) => '<i class="' + (r === 3 ? (i === 1 ? 'w' : 'm') : '') + '"></i>').join('') + '</div>').join('') + '</div>' : '') + '</div><div class="cap ph-cap">' + cap + '</div></div>';
    return '<div class="phones" data-theme="' + theme() + '">' +
      ph(app({ title: 'Acme · Staff PM', bal: BAL.mvp, scrolled: true, transcript: mvpTranscript('target', {}), dock: {} }), false, 'Conversation — composer in thumb reach') +
      ph(app({ title: 'Saved roles', bal: BAL.gate, initials: 'PN', scrolled: true, transcript: gateTranscript('short'), dock: { gate: true, value: 'yes', ph: 'Type yes to approve' } }), true, 'Gate with the keyboard up') +
      ph(app({ title: 'Acme · Staff PM', bal: BAL.mvp, scrolled: true, transcript: mvpTranscript('target', {}), dock: {}, panel: 'resume', phone: true }), false, 'Document as a full-screen sheet') + '</div>';
  },
  states(f) { return statesSheet(); },
};
function landing() {
  const preview = app({ title: 'Acme · Staff PM', bal: BAL.mvp, scrolled: true, top: true, transcript: user('found this one: <a href="#">https://boards.greenhouse.io/acme/jobs/4102938</a>') + '<div class="turn">' + act('m6') + '<div class="stack">' + verdict(ACME) + '</div>' + prose([T.target.m6]) + '</div>' + user('yes please') + '<div class="turn">' + act('m8') + '<div class="stack">' + docchip('resume') + docchip('letter') + '</div></div>', dock: {} });
  return '<div class="land" data-theme="' + theme() + '"><div class="land-l"><a class="brand" href="#landing">' + MARK(30) + '<span class="wm" style="font-size:20px">Ten</span></a><div class="mid"><h1>Get a job offer you actually want.</h1><p class="lead">Ten does the legwork of a job search — research, fit scores, tailored résumés — and leaves you only the parts that need you.</p>' +
    '<ul class="proofs">' + PROOF.map(p => '<li>' + ic(p[0], 18) + '<span><b>' + p[1] + '</b>' + p[2] + '</span></li>').join('') + '</ul>' +
    '<form class="form" onsubmit="return false"><label for="em">Email</label><input id="em" class="field" type="email" value="" placeholder="you@example.com" autocomplete="email"><div style="height:10px"></div><button class="btn pri full lg">' + ic('mail', 17) + 'Email me a sign-in link</button><div class="row"><a class="a" href="#">Use a password instead</a><span>Invite-only beta</span></div></form></div>' +
    '<div class="trust">' + ic('lock', 15) + TRUST.map(t => '<span>' + t + '</span>').join('<i class="dot"></i>') + '<span class="sp"></span><a class="a" href="#">' + COPY.local + '</a></div></div>' +
    '<div class="land-r"><div class="win" aria-label="A preview of the Ten app">' + preview + '</div></div></div>';
}
function statesSheet() {
  const b = (cls, st, label, extra) => '<div class="cell"><button class="btn ' + cls + ' ' + (st || '') + '"' + (st === 'disabled' ? ' disabled' : '') + '>' + (extra || '') + label + '</button><small>' + (st || 'default') + '</small></div>';
  const tk = [['--bg', '#FFFFFF', '#111113'], ['--bg-subtle', '#F7F7F8', '#18181B'], ['--text', '#0B0B0D', '#EDEDEF'], ['--text-2', '#51515B', '#A6A6B0'], ['--border', '#E6E6EA', '#2A2A2F'], ['--primary', '#0B0B0D', '#EDEDEF'], ['--focus', '#2F6FEB', '#7FA6FF'], ['--ok', '#157F3C', '#4ADE80'], ['--wait', '#9A5B07', '#F5B454'], ['--bad', '#B42318', '#F97066']];
  const dk = theme() === 'dark';
  return '<div class="shell" data-theme="' + theme() + '" style="overflow:auto"><div class="sheet">' +
    '<h2>Brand — mark + wordmark, and the favicon at 16 and 32 px</h2><div class="row" style="gap:32px"><span class="brand">' + MARK(40) + '<span class="wm" style="font-size:28px">Ten</span></span><span class="brand">' + MARK(26) + '<span class="wm">Ten</span></span>' + MARK(32) + MARK(16) + '<img src="' + faviconHref('#0B0B0D', '#FFFFFF', '#FFFFFF') + '" width="16" height="16" alt="favicon 16"><img src="' + faviconHref('#0B0B0D', '#FFFFFF', '#FFFFFF') + '" width="32" height="32" alt="favicon 32"></div>' +
    '<h2>Buttons — default · hover · pressed · focus-visible · disabled · loading (width fixed, label kept)</h2><div class="row">' + b('pri', '', 'Email me a link') + b('pri', 'is-hover', 'Email me a link') + b('pri', 'is-press', 'Email me a link') + b('pri', 'is-focus', 'Email me a link') + b('pri', 'disabled', 'Email me a link') + '<div class="cell"><button class="btn pri" style="width:164px" aria-busy="true"><span class="spin">' + ic('loader-circle', 16) + '</span>Sending…</button><small>loading</small></div></div>' +
    '<div class="row" style="margin-top:14px">' + b('sec', '', 'Sign in with a password') + b('sec', 'is-hover', 'Hover') + b('sec', 'is-press', 'Pressed') + b('sec', 'is-focus', 'Focus') + b('sec', 'disabled', 'Disabled') + b('ghost', '', 'Ghost') + b('ghost', 'is-hover', 'Ghost hover') + '</div>' +
    '<h2>Composer — empty (send disabled) · typing · running (stop, same size) · waiting for a yes</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' + composer({}) + composer({ value: 'Can you look for more roles like Acme’s?' }) + composer({ running: true }) + composer({ gate: true, value: 'yes' }) + '</div>' +
    '<h2>Activity line — live (updates its verb in place) · done, collapsed · expanded with one step’s details</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:start">' + act('m8', { live: true, liveText: 'Checking both documents…', doneCount: 4 }) + act('m6') + act('m6', { open: true, raw: 5 }) + '</div>' +
    '<h2>Document chip — default · hover · open in the panel</h2><div class="row" style="align-items:flex-start">' + '<div style="width:420px">' + docchip('resume') + '</div><div style="width:420px">' + docchip('letter').replace('class="docchip"', 'class="docchip" style="box-shadow:var(--e2)"') + '</div><div style="width:420px">' + docchip('resume', { on: true }) + '</div></div>' +
    '<h2>Loading — the panel while a file loads (skeleton holds the page size) · empty panel</h2><div class="row" style="align-items:stretch"><div style="width:360px;height:260px;background:var(--bg-subtle);border-radius:12px;padding:20px;box-shadow:var(--e1)"><div style="background:#fff;border-radius:4px;height:100%;padding:24px;box-shadow:var(--e1)"><div class="sk" style="height:18px;width:50%"></div><div class="sk" style="height:10px;width:70%;margin-top:10px"></div><div class="sk" style="height:10px;width:30%;margin-top:22px"></div><div class="sk" style="height:10px;margin-top:10px"></div><div class="sk" style="height:10px;width:90%;margin-top:8px"></div><div class="sk" style="height:10px;width:80%;margin-top:8px"></div></div></div><div style="width:360px;height:260px;border-radius:12px;box-shadow:var(--e1);background:var(--bg-subtle)">' + panel('empty').replace('class="panel"', 'class="panel" style="height:100%;border:0;box-shadow:none;background:none"') + '</div>' +
    '<div class="cell" style="position:relative;width:300px;height:260px"><div class="menu" style="position:static;width:280px">' + menu({}).replace('<div class="menu" role="menu">', '').replace(/<\/div>$/, '') + '</div><small>account menu</small></div></div>' +
    '<h2>Toast — confirms a finished action, bottom-centre above the composer, 4 s, dismissible</h2><div style="position:relative;height:60px">' + toastEl('Added $9.16 of credit').replace('class="toast"', 'class="toast" style="position:static;transform:none;display:inline-flex;animation:none"') + '</div>' +
    '<h2>Elevation</h2><div class="row"><div class="elev" style="box-shadow:0 0 0 1px var(--border)">e0 · hairline</div><div class="elev" style="box-shadow:var(--e1)">e1 · cards, chips</div><div class="elev" style="box-shadow:var(--e2)">e2 · composer, hover</div><div class="elev" style="box-shadow:var(--e3)">e3 · dialog, menu, panel</div></div>' +
    '<h2>Type scale</h2><div style="display:grid;gap:10px"><div style="font:400 58px/60px var(--font-display)">Display 58/60 Instrument Serif</div><div style="font:400 44px/50px var(--font-display)">Title 44/50 Instrument Serif</div><div style="font:600 20px/28px var(--font-ui);letter-spacing:-.015em">Heading 20/28 Inter 600</div><div style="font:600 15.5px/22px var(--font-ui)">Card title 15.5/22 Inter 600</div><div style="font:400 16px/28px var(--font-ui)">Body 16/28 Inter 400 — the coach’s prose reads at this size.</div><div style="font:500 14px/20px var(--font-ui);color:var(--text-2)">UI 14/20 Inter 500 — buttons, activity line</div><div style="font:400 13px/18px var(--font-ui);color:var(--text-3)">Meta 13/18 Inter 400</div><div style="font:400 12px/16px var(--font-mono);color:var(--text-3)">Mono 12/16 JetBrains Mono — file paths in details rows only</div></div>' +
    '<h2>Color tokens (light / dark)</h2><div class="row">' + tk.map(t => '<div class="sw"><i style="background:' + (dk ? t[2] : t[1]) + '"></i><small>' + t[0] + '<br>' + t[1] + ' / ' + t[2] + '</small></div>').join('') + '</div>' +
    '</div></div>';
}

/* ---------------- runtime ---------------- */
function openDoc(k) { setFlag('doc', false); if (k) { const r = route(); r.flags.doc = k; location.hash = (r.screen === 'doc' ? 'doc' : r.screen) + Object.keys(r.flags).map(x => '&' + x + (r.flags[x] === true ? '' : '=' + r.flags[x])).join(''); } else { const r = route(); if (r.screen === 'doc') location.hash = 'convo'; } }
function showToast(t) { const s = document.querySelector('.shell'); if (!s) return; const el = document.createElement('div'); el.innerHTML = toastEl(t); s.appendChild(el.firstChild); setTimeout(() => { const x = s.querySelector('.toast'); x && x.remove(); }, 4000); }
function render() {
  const r = route();
  document.body.classList.toggle('clean', !!r.flags.clean);
  document.body.classList.toggle('has-proto', !r.flags.clean);
  const extra = (r.screen === 'convo' ? '<a href="#convo' + (r.flags.stream ? '' : '&stream') + (r.flags.dark ? '&dark' : '') + '">' + (r.flags.stream ? 'Show finished' : 'Show mid-reply') + '</a>' : '') + (r.screen === 'gate' ? '<a href="#gate' + (r.flags.approved ? '' : '&approved') + '">' + (r.flags.approved ? 'Show waiting' : 'Show approved') + '</a>' : '') + (r.screen === 'credit' ? '<a href="#credit' + (r.flags.done ? '' : '&done&toast') + '">' + (r.flags.done ? 'Show purchase' : 'Show credited + toast') + '</a>' : '');
  document.getElementById('proto').innerHTML = protoBar('Direction A · Conversation-first', extra);
  document.documentElement.setAttribute('data-theme', theme());
  const fn = S[r.screen] || S.convo;
  const st = document.getElementById('stage');
  st.innerHTML = fn(r.flags);
  st.querySelectorAll('.scroll[data-autoscroll="1"]').forEach(s => { s.scrollTop = s.scrollHeight; });
  if (r.screen === 'gate' && !r.flags.approved) st.querySelectorAll('.stage > .shell .scroll-target, .shell > .app .scroll-target').forEach(t => { const sc = t.closest('.scroll'); if (sc && !t.closest('.phone')) sc.scrollTop = t.offsetTop - 24; });
  const h = st.querySelector('.hd');
}
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const r = route(); if (r.flags.dialog || r.flags.menu) { setFlag('dialog', false); setFlag('menu', false); } } });
render();
</script>
