<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten — Direction C · Search home</title>
<link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================= Direction C tokens — light is the production default ================= */
:root{
  --font-display:"Bricolage Grotesque",ui-sans-serif,"Arial Black",-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-page:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; /* render_resume.py's own stack */

  --bg:#FFFFFF; --rail:#F4F5F7; --canvas:#F7F8FA; --surface:#FFFFFF; --surface-2:#F7F8FA; --muted:#EEF0F3;
  --border:#E4E6EB; --border-strong:#D0D4DB;
  --text:#0A0A0B; --text-2:#4A4F57; --text-3:#858B95;
  --primary:#0A0A0B; --primary-hover:#25272B; --primary-press:#000; --on-primary:#FFFFFF;
  --hover:#EEF0F3; --press:#E4E7EB; --rail-active:#FFFFFF;
  --lime:#C8F03C; --lime-hover:#B9E22A; --lime-press:#A9D11C; --on-lime:#0A0A0B; --lime-soft:#F1FAD3; --lime-ink:#3D5700;
  --hero:#0B0C0E; --on-hero:#F4F5F7; --on-hero-2:#A3A8B0; --hero-line:#26282D;
  --focus:#2F6FEB;
  --ok:#157F3C; --ok-bg:#E9F6EE; --ok-border:#BFE3CB;
  --wait:#9A5B07; --wait-bg:#FFF6E6; --wait-border:#F0D29C;
  --bad:#B42318; --bad-bg:#FEF3F2; --bad-border:#F5C7C1;
  --stretch:#2B5AB5; --stretch-bg:#EEF3FC; --weak:#5E6470; --weak-bg:#F0F1F4;
  --scrim:rgba(10,10,11,.34);
  --e1:0 1px 2px rgba(16,18,22,.05),0 0 0 1px rgba(16,18,22,.07);
  --e2:0 2px 4px -1px rgba(16,18,22,.06),0 10px 24px -8px rgba(16,18,22,.12),0 0 0 1px rgba(16,18,22,.07);
  --e3:0 28px 64px -16px rgba(16,18,22,.26),0 8px 20px -8px rgba(16,18,22,.12),0 0 0 1px rgba(16,18,22,.08);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;--s16:64px;
  --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-full:999px;
  --dur-fast:120ms;--dur:200ms;--dur-slow:320ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0E0F11; --rail:#131417; --canvas:#111215; --surface:#17181B; --surface-2:#1C1D21; --muted:#23252A;
  --border:#26282D; --border-strong:#353840;
  --text:#F2F3F5; --text-2:#A3A8B0; --text-3:#6E737C;
  --primary:#F2F3F5; --primary-hover:#D9DBDF; --primary-press:#FFF; --on-primary:#0A0A0B;
  --hover:#1F2125; --press:#26282D; --rail-active:#1F2125;
  --lime:#C8F03C; --lime-hover:#D4F65C; --lime-press:#B9E22A; --on-lime:#0A0A0B; --lime-soft:#222A0C; --lime-ink:#D7F57A;
  --hero:#1A1C20; --on-hero:#F2F3F5; --on-hero-2:#A3A8B0; --hero-line:#2C2F35;
  --focus:#7FA6FF;
  --ok:#4ADE80; --ok-bg:#12301C; --ok-border:#1F5131;
  --wait:#F5B454; --wait-bg:#33260F; --wait-border:#664A18;
  --bad:#F97066; --bad-bg:#3A1714; --bad-border:#6E2A24;
  --stretch:#8FB2FF; --stretch-bg:#18233F; --weak:#A3A8B0; --weak-bg:#23252A;
  --scrim:rgba(0,0,0,.6);
  --e1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);
  --e2:0 10px 24px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
  --e3:0 28px 64px -16px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.stage{position:fixed;inset:0;overflow:auto;background:var(--bg)}
.sp{flex:1}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex:none;display:inline-block}
.num{font-variant-numeric:tabular-nums}

/* ================= shell: rail + page ================= */
.shell{container:shell/inline-size;position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--border);padding:14px 10px 10px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;text-decoration:none;color:var(--text)}
.wm{font:700 21px/1 var(--font-display);letter-spacing:-.03em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{white-space:nowrap;position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);text-decoration:none;font:500 14px/1 var(--font-ui);color:var(--text-2);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.nav a:hover,.nav a.is-hover{background:var(--hover);color:var(--text)}
.nav a:active{background:var(--press)}
.nav a.on{background:var(--rail-active);color:var(--text);box-shadow:var(--e1)}
.nav a .ic{color:var(--text-3)}
.nav a.on .ic{color:var(--text)}
.nav .ct{margin-left:auto;font:500 12px/1 var(--font-ui);color:var(--text-3);font-variant-numeric:tabular-nums}
.nav .flag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-full);background:var(--wait-bg);color:var(--wait);font:600 11px/1 var(--font-ui);box-shadow:0 0 0 1px var(--wait-border)}
.nav .busy{margin-left:auto;color:var(--text-3)}
.rail h6{margin:22px 10px 8px;font:500 12px/16px var(--font-ui);color:var(--text-3)}
.appl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--text)}
.appl:hover{background:var(--hover)}
.appl b{display:block;font:500 13.5px/18px var(--font-ui)}
.appl small{display:block;font:400 12px/16px var(--font-ui);color:var(--text-3)}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--hero);color:var(--on-hero);font:700 13px/1 var(--font-display);flex:none}
.logo.lg{width:44px;height:44px;border-radius:12px;font-size:20px}
.logo.alt{background:var(--muted);color:var(--text)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.acct{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);text-align:left;width:100%}
.acct:hover{background:var(--hover)}
.top-av{display:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--on-lime);font:700 12px/30px var(--font-ui);text-align:center;flex:none}
.acct b{display:block;font:600 13px/17px var(--font-ui)}
.acct small{display:block;font:400 12px/16px var(--font-ui);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.page{display:grid;grid-template-rows:60px minmax(0,1fr);min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:0 20px 0 28px;border-bottom:1px solid var(--border);min-width:0}
.top h1{margin:0;font:600 17px/24px var(--font-ui);letter-spacing:-.01em;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;font:500 14px/20px var(--font-ui);color:var(--text-3);white-space:nowrap;min-width:0}
.crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--text)}
.ctx{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:var(--r-full);background:var(--surface-2);box-shadow:0 0 0 1px var(--border);font:500 12.5px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.credit{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;border-radius:var(--r-full);background:var(--surface);box-shadow:0 0 0 1px var(--border);font:500 13.5px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.credit b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.credit .buy{height:26px;padding:0 11px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font:600 12.5px/26px var(--font-ui);transition:background var(--dur-fast) var(--ease)}
.credit .buy:hover{background:var(--primary-hover)}.credit .buy:active{background:var(--primary-press)}
.credit.zero{background:var(--wait-bg);box-shadow:0 0 0 1px var(--wait-border);color:var(--wait)}.credit.zero b{color:var(--wait)}
.body{min-height:0;overflow:auto;background:var(--canvas)}
.body.white{background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 36px 56px}
.tabbar{display:none}

/* ================= shared pieces ================= */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1)}
.card-hd{display:flex;align-items:center;gap:10px;padding:16px 20px 12px}
.card-hd h3{margin:0;font:600 15px/22px var(--font-ui);letter-spacing:-.005em}
.card-hd .ic{color:var(--text-2)}
.card-hd .aside{margin-left:auto;font:400 13px/18px var(--font-ui);color:var(--text-3);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-sm);font:600 14px/1 var(--font-ui);white-space:nowrap;transition:background var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover,.btn.pri.is-hover{background:var(--primary-hover)}.btn.pri:active,.btn.pri.is-press{background:var(--primary-press)}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.lime:hover,.btn.lime.is-hover{background:var(--lime-hover)}.btn.lime:active,.btn.lime.is-press{background:var(--lime-press)}
.btn.sec{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn.sec:hover,.btn.sec.is-hover{background:var(--hover)}.btn.sec:active,.btn.sec.is-press{background:var(--press)}
.btn.ghost{color:var(--text-2)}.btn.ghost:hover,.btn.ghost.is-hover{background:var(--hover);color:var(--text)}
.btn:disabled{background:var(--muted);color:var(--text-3);box-shadow:none;cursor:not-allowed}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn.lg{height:46px;font-size:15px;border-radius:10px;padding:0 18px}
.btn.full{width:100%}
.is-focus{outline:2px solid var(--focus);outline-offset:2px}
.ib{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);transition:background var(--dur-fast) var(--ease)}
.ib:hover{background:var(--hover);color:var(--text)}.ib:active{background:var(--press)}
.tier{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 8px;border-radius:var(--r-full);font:600 12.5px/1 var(--font-ui);white-space:nowrap}
.tier.strong{background:var(--ok-bg);color:var(--ok)}
.tier.investable_stretch{background:var(--stretch-bg);color:var(--stretch)}
.tier.weak{background:var(--weak-bg);color:var(--weak)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);background:var(--surface-2);box-shadow:0 0 0 1px var(--border);font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.pill.lime{background:var(--lime-soft);box-shadow:none;color:var(--lime-ink)}
.mins{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-full);background:var(--surface-2);box-shadow:0 0 0 1px var(--border);font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.score{font:600 30px/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score small{font:500 13px/1 var(--font-ui);color:var(--text-3);letter-spacing:0;margin-left:2px}
.lnk{display:inline-flex;align-items:center;gap:4px;font:500 13.5px/20px var(--font-ui);color:var(--text);text-decoration:none;border-radius:6px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.docrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--e1);text-align:left;transition:box-shadow var(--dur) var(--ease)}
.docrow:hover{box-shadow:var(--e2)}
.docrow.on{box-shadow:0 0 0 2px var(--text),var(--e1)}
.doc-ic{width:34px;height:40px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:var(--text-2);flex:none}
.docrow .tx{flex:1;min-width:0}
.docrow b{display:block;font:600 14px/19px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docrow .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:400 12.5px/17px var(--font-ui);color:var(--text-2)}
.okt{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:500;white-space:nowrap}
.docrow .go{color:var(--text-3)}
.ring{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;margin-top:2px}
.sk{background:var(--muted);border-radius:6px}

/* ================= Home ================= */
.hello{display:flex;align-items:flex-end;gap:16px;margin:0 0 20px}
.hello h2{margin:0;font:600 34px/38px var(--font-display);letter-spacing:-.03em}
.hello p{margin:6px 0 0;font:400 14.5px/21px var(--font-ui);color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e1);margin:0 0 16px;overflow:hidden}
.pipe div{position:relative;padding:14px 18px 16px;border-left:1px solid var(--border)}
.pipe div:first-child{border-left:0}
.pipe small{display:flex;align-items:center;gap:6px;font:500 12.5px/16px var(--font-ui);color:var(--text-3)}
.pipe b{display:block;margin-top:6px;font:600 30px/32px var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pipe span{display:block;font:400 12.5px/17px var(--font-ui);color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .now{background:var(--lime-soft)}
.pipe .now small{color:var(--lime-ink)}
.pipe .now::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lime)}
.pipe .zero b{color:var(--text-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{background:var(--hero);color:var(--on-hero);border-radius:var(--r-lg);padding:20px 22px 20px;box-shadow:var(--e2);position:relative;overflow:hidden}
.hero .who{display:flex;align-items:center;gap:10px;font:500 13px/18px var(--font-ui);color:var(--on-hero-2)}
.hero .who b{color:var(--on-hero);font-weight:600}
.hero blockquote{margin:14px 0 16px;font:500 19px/28px var(--font-ui);letter-spacing:-.01em;color:var(--on-hero)}
.hero .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0 0;border-top:1px solid var(--hero-line);font:400 13px/18px var(--font-ui);color:var(--on-hero-2)}
.hero .acts .ic{color:var(--lime)}
.hero .row{display:flex;gap:10px;align-items:center;margin-top:16px}
.hero .reply{text-decoration:none;flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:var(--r-md);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:400 14.5px/1 var(--font-ui);color:var(--on-hero-2);text-align:left}
.hero .reply:hover{background:rgba(255,255,255,.1)}
.hero .reply .k{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--lime);color:var(--on-lime)}
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:12px;padding:12px 20px;border-top:1px solid var(--border)}
.plan .pt{font:500 14.5px/21px var(--font-ui)}
.plan .pw{font:400 13px/19px var(--font-ui);color:var(--text-2);margin-top:1px}
.plan .chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;height:28px;padding:0 10px 0 8px;border-radius:var(--r-sm);box-shadow:0 0 0 1px var(--border);background:var(--surface);font:500 12.5px/1 var(--font-ui);color:var(--text)}
.plan .chip:hover{background:var(--hover)}
.plan .mins-in{display:none;font-weight:500;color:var(--text)}
.plan-ft{display:flex;align-items:center;gap:8px;padding:12px 20px 14px;border-top:1px solid var(--border);font:400 12.5px/18px var(--font-ui);color:var(--text-3)}
.stepper{display:flex;align-items:flex-start;padding:4px 20px 16px;gap:0}
.st{flex:1;min-width:0;position:relative;padding-top:22px}
.st::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--border)}
.st.done::before,.st.now::before{background:var(--text)}
.st.now::before{background:linear-gradient(90deg,var(--text) 50%,var(--border) 50%)}
.st:first-child::before{left:8px}.st:last-child::before{right:calc(100% - 8px)}
.st i{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--border-strong);display:grid;place-items:center}
.st.done i{background:var(--text);box-shadow:none;color:var(--bg)}
.st.now i{background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft),inset 0 0 0 2px var(--text)}
.st b{display:block;font:600 12.5px/16px var(--font-ui);color:var(--text);white-space:nowrap}
.st span{display:block;font:400 12px/16px var(--font-ui);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.st.todo b{color:var(--text-3);font-weight:500}
.appcard .top2{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
.appcard .top2 b{display:block;font:600 16px/22px var(--font-ui)}
.appcard .top2 small{display:block;font:400 13px/18px var(--font-ui);color:var(--text-3)}
.appcard .docs{display:flex;flex-direction:column;gap:8px;padding:0 20px 16px}
.appcard .next{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--border);font:400 13.5px/19px var(--font-ui);color:var(--text-2)}
.appcard .next b{color:var(--text);font-weight:600}

/* ================= Jobs / Applications (list + detail) ================= */
.md{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%;min-height:0}
.list{border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:4px;padding:12px 14px;border-bottom:1px solid var(--border)}
.filters button{height:30px;padding:0 10px;border-radius:var(--r-sm);font:500 13px/1 var(--font-ui);color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.filters button:hover{background:var(--hover)}
.filters button.on{background:var(--muted);color:var(--text)}
.filters .c{color:var(--text-3);font-variant-numeric:tabular-nums}
.rows{flex:1;overflow:auto;padding:8px}
.jrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px;border-radius:var(--r-md);text-align:left}
.jrow:hover{background:var(--hover)}
.jrow.on{background:var(--surface);box-shadow:0 0 0 1.5px var(--text)}
.jrow .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.jrow b{display:block;font:600 14px/19px var(--font-ui)}
.jrow small{display:flex;align-items:center;gap:6px;font:400 12.5px/17px var(--font-ui);color:var(--text-3);margin-top:1px}
.jrow .sc{text-align:right;font:600 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.jrow .sc small{display:block;margin-top:5px;justify-content:flex-end}
.list-empty{margin:8px;padding:16px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);font:400 13px/19px var(--font-ui);color:var(--text-2)}
.list-empty b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}
.list-empty .btn{margin-top:10px}
.detail{overflow:auto;background:var(--canvas);min-width:0}
.dwrap{max-width:860px;margin:0 auto;padding:28px 36px 56px}
.back-n{display:none;align-items:center;gap:4px;margin:0 0 12px;font:500 14px/20px var(--font-ui);color:var(--text-2);text-decoration:none}
.dhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.dhead h2{margin:0;font:600 28px/34px var(--font-display);letter-spacing:-.025em}
.dhead .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font:400 14px/20px var(--font-ui);color:var(--text-2)}
.dhead .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.verdict-band{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:18px 20px;margin-bottom:16px}
.verdict-band .big{text-align:center;padding-right:20px;border-right:1px solid var(--border)}
.verdict-band .big .score{font-size:44px;display:block;white-space:nowrap}
.verdict-band .big small{display:block;font:400 12px/16px var(--font-ui);color:var(--text-3);margin-top:6px}
.verdict-band p{margin:8px 0 0;font:400 15px/23px var(--font-ui);color:var(--text)}
.sect{padding:16px 20px 18px}
.sect h4{margin:0 0 10px;font:600 13px/18px var(--font-ui);color:var(--text-3)}
.sect p{margin:0 0 8px;font:400 14.5px/22px var(--font-ui)}
.sect p:last-child{margin:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;font:400 14px/21px var(--font-ui)}
.kv dt{color:var(--text-3)}.kv dd{margin:0}
.sig{list-style:none;margin:0;padding:0}
.sig li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--border);font:400 14px/21px var(--font-ui)}
.sig li:first-child{border-top:0;padding-top:0}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-xs);font:600 11px/1 var(--font-ui);white-space:nowrap;margin-top:1px}
.tag.v{background:var(--ok-bg);color:var(--ok)}.tag.u{background:var(--muted);color:var(--text-2)}
.cover{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-ui)}
.cover th{text-align:left;font:500 12.5px/16px var(--font-ui);color:var(--text-3);padding:0 12px 8px 0}
.cover td{padding:10px 12px 10px 0;border-top:1px solid var(--border);vertical-align:top}
.cover td:first-child{font-weight:500;width:32%}.cover td:last-child{width:130px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px 18px}
.thumb{text-decoration:none;color:inherit;display:block;text-align:left;border-radius:var(--r-md);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);padding:12px 12px 0;overflow:hidden;transition:box-shadow var(--dur) var(--ease)}
.thumb:hover{box-shadow:inset 0 0 0 1px var(--border-strong),var(--e2)}
.thumb .paperbox{height:150px;overflow:hidden;border-radius:4px 4px 0 0;box-shadow:var(--e1);background:#fff}
.thumb .paperbox .paper{transform:scale(.46);transform-origin:top left;width:217%;box-shadow:none;margin:0}
.thumb .cap{padding:10px 2px 12px}
.thumb .cap b{display:block;font:600 13.5px/18px var(--font-ui)}
.thumb .cap small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:400 12px/16px var(--font-ui);color:var(--text-2);margin-top:2px}

/* ================= Documents ================= */
.dsecs{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:28px}
.dgroup{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 14px/20px var(--font-ui)}
.dgroup small{font:400 13px/18px var(--font-ui);color:var(--text-3)}
.dcard{display:block;text-align:left;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1);overflow:hidden;transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.dcard:hover{box-shadow:var(--e2)}
.dcard .pv{height:200px;background:var(--surface-2);border-bottom:1px solid var(--border);padding:16px 18px 0;overflow:hidden}
.dcard .pv .paperbox{height:100%;background:#fff;border-radius:4px 4px 0 0;box-shadow:var(--e1);overflow:hidden}
.dcard .pv .paper{transform:scale(.42);transform-origin:top left;width:238%;box-shadow:none;margin:0}
.dcard .pv.pdf{display:grid;place-items:center;color:var(--text-3)}
.dcard .pv.pdf span{display:flex;flex-direction:column;align-items:center;gap:8px;font:600 12px/1 var(--font-ui)}
.dcard .cap{padding:12px 14px 14px}
.dcard .cap b{display:block;font:600 14px/19px var(--font-ui)}
.dcard .cap small{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font:400 12.5px/17px var(--font-ui);color:var(--text-2);margin-top:3px}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100%;min-height:0}
.viewer .canvas{overflow:auto;background:var(--canvas);padding:28px 32px 48px}
.mbar,.mchk{display:none}
.viewer .side{border-left:1px solid var(--border);background:var(--bg);overflow:auto;padding:20px}
.side h4{margin:18px 0 8px;font:600 12.5px/16px var(--font-ui);color:var(--text-3)}
.side h4:first-child{margin-top:0}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);font:400 13.5px/19px var(--font-ui);margin-bottom:8px}
.chk b{display:block;font-weight:600}
.chk small{color:var(--text-2)}
.chk .ok{color:var(--ok)}.chk .na{color:var(--text-3)}
.side .cutl{margin:0;padding:0 0 0 18px;font:400 13.5px/20px var(--font-ui);color:var(--text)}
.side .cutl li{margin-bottom:8px}.side .cutl small{display:block;color:var(--text-3)}
.path{font:400 12px/17px var(--font-mono);color:var(--text-2);overflow-wrap:anywhere}

/* the rendered page — render_resume.py's own CSS at screen size */
.paper{background:#fff;color:#111;border-radius:4px;box-shadow:var(--e2);padding:44px 52px 56px;max-width:640px;margin:0 auto;font-family:var(--font-page)}
.paper h1{font-size:24px;letter-spacing:.5px;margin:0 0 3px}
.paper .ct{font-size:12.7px;margin:0 0 10px}
.paper h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #222;padding-bottom:3px;margin:12px 0 6px}
.paper h3{font-size:14px;margin:9px 0 2px}
.paper p,.paper li{font-size:13.3px;line-height:1.32}
.paper p{margin:0 0 5px}.paper ul{margin:3px 0 5px;padding-left:18px}.paper li{margin:0 0 3px}
.paper.letter p{line-height:1.55;margin:0 0 11px}

/* ================= Talk to Ten ================= */
.talk{display:grid;grid-template-columns:minmax(0,1fr) 0;height:100%;min-height:0}
.talk.with-panel{grid-template-columns:minmax(0,1fr) 460px}
.chat{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-anchor:auto}
.thread{max-width:760px;margin:0 auto;padding:24px 28px 24px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;margin:0 0 26px}
.msg .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;overflow:hidden}
.msg .av.you{border-radius:50%;background:var(--lime);color:var(--on-lime);font:700 11px/28px var(--font-ui);text-align:center}
.msg .nm{display:flex;align-items:baseline;gap:8px;font:600 14px/20px var(--font-ui);margin:3px 0 4px}
.msg .nm small{font:400 12px/1 var(--font-ui);color:var(--text-3)}
.msg.you .txt{font:400 15.5px/25px var(--font-ui);color:var(--text)}
.msg.you .txt a{text-decoration:underline;text-decoration-color:var(--text-3);text-underline-offset:3px;overflow-wrap:anywhere}
.prose{font:400 15.5px/26px var(--font-ui);color:var(--text)}
.prose p{margin:0 0 12px}.prose p:last-child{margin:0}
.prose b{font-weight:600}
.prose code{font:500 12.5px/1 var(--font-mono);background:var(--muted);padding:2px 5px;border-radius:5px;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.attach{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:8px 14px 8px 8px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--e1)}
.attach .ft{width:30px;height:34px;border-radius:6px;background:var(--muted);display:grid;place-items:center;color:var(--text-2);font:700 8.5px/1 var(--font-ui)}
.attach b{display:block;font:500 13px/17px var(--font-ui)}.attach small{font:400 12px/16px var(--font-ui);color:var(--text-3)}
.cuts{list-style:none;counter-reset:c;margin:4px 0 14px;padding:0;border-radius:var(--r-md);box-shadow:0 0 0 1px var(--border);overflow:hidden}
.cuts li{counter-increment:c;display:grid;grid-template-columns:26px minmax(0,1fr);padding:10px 14px;border-top:1px solid var(--border);background:var(--surface-2)}
.cuts li:first-child{border-top:0}
.cuts li::before{content:counter(c);font:600 12.5px/24px var(--font-ui);color:var(--text-3)}
.cuts .why{display:block;font:400 13.5px/20px var(--font-ui);color:var(--text-2)}
/* activity line */
.act{margin:0 0 10px}
.act-sum{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 8px;border-radius:var(--r-full);background:var(--surface-2);box-shadow:0 0 0 1px var(--border);font:500 13px/1 var(--font-ui);color:var(--text-2);transition:background var(--dur-fast) var(--ease)}
.act-sum:hover{background:var(--hover);color:var(--text)}
.act-sum .n{color:var(--text-3);font-weight:400}
.act-sum .chev{color:var(--text-3);transition:transform var(--dur) var(--ease)}
.act.open .chev{transform:rotate(90deg)}
.act .done{color:var(--ok)}
.act-steps{list-style:none;margin:8px 0 4px 14px;padding:2px 0 2px 16px;border-left:1.5px solid var(--border);display:none}
.act.open .act-steps{display:block}
.act-steps li{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:10px;padding:5px 0;font:400 13.5px/19px var(--font-ui)}
.act-steps li .ic{margin-top:2px;color:var(--text-3)}
.act-steps .m{color:var(--text-3)}
.act-steps .raw{grid-column:2;margin-top:4px;font:400 11.5px/17px var(--font-mono);color:var(--text-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);border-radius:var(--r-xs);padding:6px 8px;overflow-wrap:anywhere}
.live .act-sum{color:var(--text);background:var(--surface);box-shadow:0 0 0 1px var(--border-strong)}
.shimmer{background:linear-gradient(90deg,var(--text-2) 0%,var(--text-2) 40%,var(--text) 50%,var(--text-2) 60%,var(--text-2) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.caret{display:inline-block;width:8px;height:17px;margin-left:2px;vertical-align:-3px;background:var(--text);border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:spin 900ms linear infinite}
  .shimmer{animation:shim 1.8s linear infinite}
  .caret{animation:blink 1s steps(1) infinite}
  .panel-in{animation:slidein var(--dur-slow) var(--ease-out)}
  .dlg{animation:pop var(--dur) var(--ease-out)}
  .toast{animation:rise var(--dur-slow) var(--ease-out)}
  .sk{animation:pulse 1.4s var(--ease) infinite}
  .nav .flag i{animation:pulse 1.6s var(--ease) infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes blink{50%{opacity:0}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pulse{50%{opacity:.5}}
.nav .flag i{width:6px;height:6px;border-radius:50%;background:var(--wait)}
/* chat cards */
.vcard{padding:16px 18px;max-width:600px}
.vcard .h{display:flex;align-items:flex-start;gap:12px}
.vcard .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.vcard .t b{display:block;font:600 16px/21px var(--font-ui)}
.vcard .t small{display:flex;align-items:center;gap:6px;font:400 12.5px/17px var(--font-ui);color:var(--text-3);margin-top:1px}
.vcard .score{margin-left:auto;text-align:right}
.vcard p{margin:12px 0 0;font:400 14.5px/22px var(--font-ui);color:var(--text-2)}
.vcard .f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font:400 12.5px/17px var(--font-ui);color:var(--text-3)}
.vcard .f .lnk{margin-left:auto}
.pcard{max-width:600px}
.pcard .card-hd{padding:14px 18px 10px}
.pcard li{padding:11px 18px}
.checker{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:520px}
.checker .lbl{font:600 11px/1 var(--font-mono);letter-spacing:.06em;color:var(--text-3)}
.checker b{font:500 13px/18px var(--font-mono);overflow-wrap:anywhere}
.checker .okt{margin-left:auto}
.cost{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:520px}
.cost .ci{width:34px;height:34px;border-radius:9px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:var(--text-2);flex:none}
.cost b{display:block;font:500 14px/20px var(--font-ui)}
.cost small{font:400 12.5px/17px var(--font-ui);color:var(--text-3)}
.cost .amt{margin-left:auto;text-align:right;font:600 15px/20px var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost .amt small{display:block;font-weight:400}
.gate{max-width:600px;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--wait-border),var(--e2);overflow:hidden}
.gate.ok{box-shadow:var(--e1)}
.gate-hd{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--wait-bg);color:var(--wait);font:600 13.5px/20px var(--font-ui)}
.gate.ok .gate-hd{background:var(--ok-bg);color:var(--ok)}
.gate-hd .r{margin-left:auto;font-weight:500;font-size:12.5px}
.gate-b{padding:14px 18px 16px}
.gate-b h4{margin:0 0 8px;font:600 17px/24px var(--font-display);letter-spacing:-.015em}
.gate-roles{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 20px;counter-reset:g}
.gate-roles li{counter-increment:g;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font:400 13.5px/19px var(--font-ui)}
.gate-roles li::before{content:counter(g);color:var(--text-3);font-variant-numeric:tabular-nums;width:12px}
.gate-cost{display:flex;gap:24px;margin:0 0 12px;font:400 12.5px/17px var(--font-ui);color:var(--text-3)}
.gate-cost b{display:block;font:600 16px/22px var(--font-ui);color:var(--text);font-variant-numeric:tabular-nums}
.gate-line{margin:0;padding:11px 14px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);font:600 14.5px/21px var(--font-ui)}
.gate-how{display:flex;align-items:center;gap:8px;margin-top:12px;font:400 13px/19px var(--font-ui);color:var(--text-2)}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--border-strong),inset 0 -2px 0 var(--border-strong);font:600 12px/1 var(--font-mono);color:var(--text);background:var(--surface)}
.err{display:flex;gap:12px;align-items:flex-start;max-width:600px;padding:14px 16px;border-radius:var(--r-md);background:var(--bad-bg);box-shadow:0 0 0 1px var(--bad-border)}
.err .ic{color:var(--bad);margin-top:2px}
.err b{display:block;font:600 14.5px/20px var(--font-ui)}
.err p{margin:2px 0 0;font:400 14px/21px var(--font-ui);color:var(--text-2)}
/* composer, docked */
.dock{padding:0 28px 18px;background:var(--bg)}
.dock-in{max-width:760px;margin:0 auto;padding-left:44px}
.composer{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e2);padding:12px 12px 10px 16px;transition:box-shadow var(--dur) var(--ease)}
.composer:focus-within{box-shadow:0 0 0 1.5px var(--text),var(--e2)}
.composer.gate-mode{box-shadow:0 0 0 2px var(--wait-border),var(--e2)}
.cmp-in{display:block;width:100%;min-height:24px;max-height:200px;resize:none;border:0;outline:0;background:transparent;font:400 15.5px/24px var(--font-ui);padding:2px 0 8px}
.cmp-in::placeholder{color:var(--text-3)}
.cmp-row{display:flex;align-items:center;gap:6px}
.tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 9px;border-radius:var(--r-full);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.tb:hover{background:var(--hover);color:var(--text)}
.cmp-hint{font:400 12px/1 var(--font-ui);color:var(--text-3);margin-right:6px;white-space:nowrap}
.send{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);transition:background var(--dur-fast) var(--ease)}
.send:hover{background:var(--primary-hover)}.send:active{background:var(--primary-press)}
.send:disabled{background:var(--muted);color:var(--text-3);cursor:not-allowed}
.gate-tip{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;height:28px;padding:0 12px;border-radius:var(--r-full);background:var(--wait-bg);box-shadow:0 0 0 1px var(--wait-border);font:500 12.5px/1 var(--font-ui);color:var(--wait)}
/* side panel */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--border);background:var(--canvas)}
.pn-hd{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--border);background:var(--bg)}
.pn-hd .tx{flex:1;min-width:0}
.pn-hd b{display:block;font:600 14.5px/20px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-hd small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:400 12px/17px var(--font-ui);color:var(--text-3)}
.nw{white-space:nowrap}
.pn-tools{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 18px;border-bottom:1px solid var(--border);background:var(--bg)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--muted);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font:500 12.5px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--e1)}
.pn-body{flex:1;overflow:auto;padding:20px}
.pn-body .paper{padding:30px 32px 36px}
.pn-meta{padding:9px 18px;border-top:1px solid var(--border);background:var(--bg);font:400 11.5px/16px var(--font-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dialogs, menu, toast */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(460px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--e3);padding:22px 24px 20px;max-height:100%;overflow:auto}
.dlg-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dlg-hd h2{margin:0;font:600 22px/28px var(--font-display);letter-spacing:-.02em}
.dlg p{margin:0 0 16px;font:400 14.5px/22px var(--font-ui);color:var(--text-2)}
.dlg .bal{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);margin:0 0 16px;font:500 13.5px/1 var(--font-ui);color:var(--text-2)}
.dlg .bal b{font:600 18px/1 var(--font-display);color:var(--text);font-variant-numeric:tabular-nums}
.dlg .fine{font-size:13px;line-height:19px;color:var(--text-3);margin:16px 0 0}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.amts button{height:54px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-strong);font:600 20px/1 var(--font-display);font-variant-numeric:tabular-nums;transition:box-shadow var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.amts button:hover{background:var(--hover)}
.amts button.on{box-shadow:inset 0 0 0 2px var(--text);background:var(--lime-soft)}
.pp{display:flex;align-items:center;justify-content:center;gap:4px;height:46px;border-radius:var(--r-full);width:100%;margin-top:8px;font:italic 800 19px/1 Verdana,Tahoma,sans-serif;letter-spacing:-.5px}
.pp.gold{background:#FFC439;color:#003087}.pp.gold span{color:#0070E0}
.pp.card{background:#2C2E2F;color:#fff;font:600 15px/1 Helvetica,Arial,sans-serif;letter-spacing:0}
.pp-note{text-align:center;font:400 11.5px/16px var(--font-ui);color:var(--text-3);margin-top:8px}
.ok-state{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--ok-bg);margin:0 0 16px}
.ok-state .ic{color:var(--ok);margin-top:1px}.ok-state p{margin:0;color:var(--text);font-weight:500}
.menu{position:absolute;left:10px;bottom:62px;width:260px;background:var(--surface);border-radius:14px;box-shadow:var(--e3);padding:6px;z-index:40}
.menu .who{padding:10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu .who b{display:block;font:600 14px/20px var(--font-ui)}.menu .who small{font:400 12.5px/18px var(--font-ui);color:var(--text-3)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;font:500 14px/1 var(--font-ui)}
.menu button .ic{color:var(--text-2)}.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .danger,.menu .danger .ic{color:var(--bad)}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--hero);color:var(--on-hero);box-shadow:var(--e3);font:500 14px/20px var(--font-ui);white-space:nowrap;z-index:60}
.toast .ic{color:var(--lime)}.toast button{margin-left:6px;opacity:.7}

/* ================= first-run / empty ================= */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid var(--border)}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--muted);font:600 13px/1 var(--font-display)}
.steps li:first-child .n{background:var(--lime);color:var(--on-lime)}
.steps b{display:block;font:600 14.5px/20px var(--font-ui)}
.steps small{display:block;font:400 13px/19px var(--font-ui);color:var(--text-2)}
.empty{display:grid;place-items:center;text-align:center;padding:48px 24px;height:100%}
.empty .ill{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--e1);color:var(--text-2);margin:0 auto 16px}
.empty h3{margin:0;font:600 20px/26px var(--font-display);letter-spacing:-.02em}
.empty p{margin:6px auto 18px;max-width:380px;font:400 14.5px/22px var(--font-ui);color:var(--text-2)}

/* ================= landing ================= */
.land{min-height:100%;background:var(--bg);position:relative;overflow:hidden}
.land-nav{display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:22px 40px}
.land-nav .a{font:500 14px/20px var(--font-ui);color:var(--text-2);text-decoration:none}
.land-nav .a:hover{color:var(--text)}
.land-hero{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto 1fr;column-gap:56px;row-gap:22px;max-width:1240px;margin:0 auto;padding:28px 40px 0;align-items:start}
.land-hero h1{margin:0;font:600 60px/62px var(--font-display);letter-spacing:-.035em}
.land-hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--lime) 62%,var(--lime) 92%,transparent 92%)}
.land .lead{margin:18px 0 0;max-width:560px;font:400 18px/28px var(--font-ui);color:var(--text-2)}
.proofs{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:580px}
.proofs li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;font:400 14.5px/21px var(--font-ui);color:var(--text-2)}
.proofs li .ic{margin-top:1px;color:var(--text)}
.proofs b{color:var(--text);font-weight:600}
.lh-text{grid-column:1;grid-row:1}.land-hero .proofs{grid-column:1;grid-row:2}.signin{grid-column:2;grid-row:1/span 2;padding:24px;border-radius:18px;background:var(--surface);box-shadow:var(--e3)}
.signin h2{margin:0 0 4px;font:600 22px/28px var(--font-display);letter-spacing:-.02em}
.signin > p{margin:0 0 18px;font:400 14px/20px var(--font-ui);color:var(--text-2)}
.signin label{display:block;font:500 13px/18px var(--font-ui);margin:0 0 6px}
.field{display:block;width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font:400 15px/1 var(--font-ui);outline:0;transition:box-shadow var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.field:hover{border-color:var(--text-3)}
.field:focus,.field.is-focus{border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.signin .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:400 13px/18px var(--font-ui);color:var(--text-3)}
.alink{color:var(--text);font-weight:500;text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.trust{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font:500 12.5px/18px var(--font-ui);color:var(--text-2)}
.trust .ic{color:var(--text-3)}
.preview{max-width:1240px;margin:44px auto 0;padding:0 40px}
.preview .win{height:560px;border-radius:16px 16px 0 0;overflow:hidden;box-shadow:var(--e3);background:var(--bg)}
.preview .win .shell{height:700px}

/* ================= phone frames ================= */
.phones{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:40px 24px;background:var(--canvas)}
.phone{width:375px;height:812px;flex:none;border-radius:44px;background:var(--bg);box-shadow:0 0 0 10px #16171a,0 0 0 11px #3a3c42,var(--e3);overflow:hidden;display:flex;flex-direction:column}
.phone .sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 15px/1 var(--font-ui);color:var(--text);background:var(--bg)}
.phone .shell{flex:1;height:auto;min-height:0}
.kb{flex:none;height:280px;background:#D1D3D9;padding:8px 4px;display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
.kb div{display:flex;gap:6px;justify-content:center}
.kb i{flex:0 0 31px;height:42px;background:#fff;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.kb i.w{flex:0 0 180px}.kb i.m{flex:0 0 44px;background:#ABB0BA}
[data-theme="dark"] .kb{background:#2b2b30}[data-theme="dark"] .kb i{background:#58585f}
.ph-cap{font:500 13px/18px var(--font-ui);color:var(--text-2);text-align:center;margin-top:16px}

/* ================= states sheet ================= */
.sheet{padding:36px 48px 80px;max-width:1280px;margin:0 auto}
.sheet h2{font:600 13px/18px var(--font-ui);color:var(--text-3);margin:36px 0 14px}
.sheet h2:first-child{margin-top:0}
.srow{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cell{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cell>small{font:400 11.5px/16px var(--font-mono);color:var(--text-3)}
.sw{width:124px;border-radius:10px;overflow:hidden;box-shadow:var(--e1);background:var(--surface)}
.sw i{display:block;height:44px}
.sw small{display:block;padding:6px 8px;font:400 11px/15px var(--font-mono);color:var(--text-2)}
.elev{width:180px;height:96px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font:500 13px/1 var(--font-ui);color:var(--text-2)}

/* ============ narrow: the same app under a container query (drives the 375 viewport and the phone frames) ============ */
@container shell (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .page{grid-template-rows:54px minmax(0,1fr)}
  .top{padding:0 12px 0 16px;gap:8px}
  .top h1{font-size:16px}
  .top .mk{display:block}
  .credit{padding:0 12px;height:32px}.credit .lbl,.credit .buy{display:none}
  .ctx,.top .hide-n{display:none}.top-av{display:block}
  .crumb .pre{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--bg);padding:6px 4px 8px}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;height:48px;justify-content:center;border-radius:10px;text-decoration:none;font:500 11px/1 var(--font-ui);color:var(--text-3);position:relative}
  .tabbar a.on{color:var(--text)}
  .tabbar a>.ic{margin:5px 0}.tabbar a{gap:2px}
  .tabbar a.on .ic{color:var(--text)}
  .tabbar a.ten .tk{width:44px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--hero);color:var(--lime)}
  .tabbar a.ten.on .tk{background:var(--lime);color:var(--on-lime)}
  .tabbar a .fl{position:absolute;top:4px;right:calc(50% - 26px);width:8px;height:8px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 2px var(--bg)}
  .wrap{padding:16px 16px 28px}
  .steps li{grid-template-columns:28px minmax(0,1fr);align-items:start;padding:14px 16px}.steps li>.btn{grid-column:2;justify-self:start}
  .hello{margin-bottom:14px}
  .hello h2{font-size:26px;line-height:30px}
  .pipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
  .pipe div{flex:0 0 104px;padding:10px 12px 12px;scroll-snap-align:start}
  .pipe b{font-size:24px;line-height:26px}.pipe span{display:none}
  .grid2{grid-template-columns:1fr}
  .hero blockquote{font-size:17px;line-height:25px}
  .hero .row{flex-direction:column;align-items:stretch}.hero .acts{font-size:12.5px}
  .plan li{grid-template-columns:20px minmax(0,1fr);padding:12px 16px}
  .plan li .mins{display:none}.plan .mins-in{display:inline}
  .md{grid-template-columns:1fr}
  .md .list{display:none}
  .back-n{display:inline-flex!important}
  .dwrap{padding:16px 16px 32px}
  .dhead{flex-wrap:wrap}.dhead h2{font-size:22px;line-height:28px}.dhead .acts{margin-left:0;width:100%}
  .verdict-band{grid-template-columns:1fr;gap:10px}.verdict-band .big{border-right:0;padding:0;text-align:left;display:flex;align-items:baseline;gap:10px}
  .split{grid-template-columns:1fr}
  .card-hd{flex-wrap:wrap;row-gap:2px}.card-hd .aside{margin-left:0;flex-basis:100%;white-space:normal}
  .dhead .logo.lg{display:none}.st span{display:none}
  .thumb .cap small .okt{white-space:normal}.thumb .paperbox{height:120px}
  .kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}
  .dsecs{grid-template-columns:1fr;gap:0}.dgrid{gap:12px;margin-bottom:20px}
  .dcard .pv{height:150px;padding:10px 12px 0}
  .dcard .pv .paper{transform:scale(.25);width:400%}
  .viewer{grid-template-columns:1fr}.viewer .side{display:none}
  .mbar{display:flex;align-items:center;gap:2px;margin:0 0 8px}.mchk{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 4px 12px;font:400 12.5px/17px var(--font-ui);color:var(--text-3)}
  .viewer .canvas{padding:12px}
  .paper{padding:24px 20px 28px}
  .talk.with-panel{grid-template-columns:1fr}
  .panel{position:absolute;inset:0;z-index:30;border:0}
  .thread{padding:16px 14px 16px}
  .msg{grid-template-columns:26px minmax(0,1fr);gap:10px;margin-bottom:20px}
  .msg .av{width:26px;height:26px}
  .dock{padding:0 10px 10px}.dock-in{padding-left:0}
  .cmp-hint,.tb .lbl{display:none}.tb{width:32px;padding:0;justify-content:center;box-shadow:none}
  .gate-roles{grid-template-columns:1fr}
  .thumbs{grid-template-columns:1fr 1fr}
  .menu{left:8px;right:8px;width:auto;bottom:70px}
  .toast{bottom:84px}
}
@media (max-width:760px){
  .land-nav{padding:16px 18px}.land-nav .hide-n{display:none}
  .land-hero{grid-template-columns:1fr;gap:24px;padding:8px 18px 0}
  .lh-text,.land-hero .proofs,.signin{grid-column:1;grid-row:auto}.lh-text{order:1}.signin{order:2}.land-hero .proofs{order:3}
  .land-hero h1{font-size:42px;line-height:44px}
  .land .lead{font-size:16.5px;line-height:25px}
  .preview{padding:0 12px;margin-top:28px}
  .preview .win{height:520px}
  .phones{padding:0;gap:0;flex-direction:column;background:var(--bg)}
  .phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
  .phone .sbar,.ph-cap,.phones>div+div{display:none}
  .sheet{padding:20px 16px}
}

function openDoc(k) {

  if (k) r.flags.doc = k; else delete r.flags.doc;
  location.hash = r.screen + Object.keys(r.flags).map(x => '&' + x + (r.flags[x] === true ? '' : '=' + r.flags[x])).join('');

function render() {
  const r = route();
  document.body.classList.toggle('clean', !!r.flags.clean);
  document.body.classList.toggle('has-proto', !r.flags.clean);
  const d = r.flags.dark ? '&dark' : '';
  const extra = (r.screen === 'talk' ? '<a href="#talk' + (r.flags.stream ? '' : '&stream') + d + '">' + (r.flags.stream ? 'Show finished' : 'Show mid-reply') + '</a><a href="#talk' + (r.flags.doc ? '' : '&doc=resume') + d + '">' + (r.flags.doc ? 'Close panel' : 'Open panel') + '</a>' : '') + (r.screen === 'gate' ? '<a href="#gate' + (r.flags.approved ? '' : '&approved') + d + '">' + (r.flags.approved ? 'Show waiting' : 'Show approved') + '</a>' : '') + (r.screen === 'credit' ? '<a href="#credit' + (r.flags.done ? '' : '&done&toast') + d + '">' + (r.flags.done ? 'Show purchase' : 'Show credited + toast') + '</a>' : '') + (['jobs', 'apps', 'docs'].includes(r.screen) ? '<a href="#' + r.screen + (r.flags.empty ? '' : '&empty') + d + '">' + (r.flags.empty ? 'Show with data' : 'Show empty') + '</a>' : '');

}
