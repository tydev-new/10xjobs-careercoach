<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Owner ruling (2026-09-24): the real app is light-only. This meta
         tag (belt-and-suspenders alongside styles.css's `:root {
         color-scheme: light }`) tells the browser's own UA chrome
         (autofill, form validation popups, initial paint before the
         stylesheet's own color-scheme rule applies) to render light
         from the very first frame, so there is no dark flash even for
         a candidate whose OS is set to dark. -->
    <meta name="color-scheme" content="light" />
    <title>Ten</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Fix round 1 added an inline window.fetch.bind() script here as a
         belt-and-suspenders fix for "Illegal invocation"
         (src/backend/bound-fetch.ts's per-call-site fix). Fix round 2
         removed it: the tester's own e2e proved it unneeded (419/440 with
         E2E_STRIP_INLINE_FETCH=1, same failures as with it) — every real
         fetch capture site in this app already goes through boundFetch(),
         and the tester's e2e now runs a STATIC check (tests/e2e-real/e2e.ts,
         "B1 static") over apps/web/src, packages/agent/src and
         packages/checkers/src instead, so a regression is caught at the
         source, not papered over globally at the page level. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
